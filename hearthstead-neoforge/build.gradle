plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'com.hearthstead'
version = mod_version

// Give every built JAR an identity that can be traced back to one exact
// source checkpoint. The value is generated from Git at build time and is
// also embedded in the manifest and runtime resources.
def gitOutput = { String... arguments ->
    try {
        def command = ['git'] + arguments.toList()
        def process = new ProcessBuilder(command)
            .directory(rootDir)
            .redirectErrorStream(true)
            .start()
        def output = process.inputStream.getText('UTF-8').trim()
        process.waitFor()
        return process.exitValue() == 0 ? output : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}

def gitExitCode = { String... arguments ->
    try {
        def command = ['git'] + arguments.toList()
        def process = new ProcessBuilder(command)
            .directory(rootDir)
            .redirectErrorStream(true)
            .start()
        process.inputStream.transferTo(OutputStream.nullOutputStream())
        process.waitFor()
        return process.exitValue()
    } catch (Exception ignored) {
        return -1
    }
}

def hearthsteadGitCommit = gitOutput('rev-parse', '--verify', 'HEAD')
gitExitCode('update-index', '-q', '--refresh')
// The JAR identity describes the compiled Hearthstead module. The QA
// controller separately fingerprints its root-level protocol and evidence;
// its transient run state must not make an otherwise clean module look dirty.
def hearthsteadModulePathspec = ':(top)hearthstead-neoforge'
def hearthsteadTrackedDirty = gitExitCode(
    'diff-index', '--quiet', 'HEAD', '--', hearthsteadModulePathspec) != 0
def hearthsteadUntrackedStatus = gitOutput(
    'ls-files', '--others', '--exclude-standard', '--', hearthsteadModulePathspec)
def hearthsteadUntrackedDirty = hearthsteadUntrackedStatus != 'unknown' && !hearthsteadUntrackedStatus.isBlank()
def hearthsteadGitDirty = hearthsteadTrackedDirty || hearthsteadUntrackedDirty
def hearthsteadBuildIdentity = "${mod_version}+g${hearthsteadGitCommit.take(12)}${hearthsteadGitDirty ? '.dirty' : ''}"
def generatedBuildInfoDir = layout.buildDirectory.dir('generated/resources/hearthsteadBuildInfo')

def generateHearthsteadBuildInfo = tasks.register('generateHearthsteadBuildInfo') {
    def outputFile = generatedBuildInfoDir.map { it.file('hearthstead-build.properties') }
    inputs.property('version', mod_version)
    inputs.property('gitCommit', hearthsteadGitCommit)
    inputs.property('gitDirty', hearthsteadGitDirty)
    inputs.property('buildIdentity', hearthsteadBuildIdentity)
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(
            "version=${mod_version}\n" +
            "gitCommit=${hearthsteadGitCommit}\n" +
            "gitDirty=${hearthsteadGitDirty}\n" +
            "buildIdentity=${hearthsteadBuildIdentity}\n",
            'UTF-8')
    }
}

sourceSets.main.resources.srcDir(generatedBuildInfoDir)
tasks.named('processResources').configure {
    dependsOn(generateHearthsteadBuildInfo)
}

// Parallel QA lanes must never contend for or erase another lane's reports.
// Pass -PhearthsteadBuildDir=<folder> to give a lane its own disposable
// build tree; ordinary developer builds keep Gradle's default `build/`.
if (project.hasProperty('hearthsteadBuildDir')) {
    layout.buildDirectory = file(project.property('hearthsteadBuildDir'))
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            def requestedNamespace = System.getenv('HSQA_GAMETEST_NAMESPACE')
            def enabledNamespace = requestedNamespace ?: project.mod_id
            def allowedNamespaces = [project.mod_id.toString(),
                                     'hearthstead_active_perf']
            if (!allowedNamespaces.contains(enabledNamespace.toString())) {
                throw new GradleException('HSQA_GAMETEST_NAMESPACE must be exactly '
                    + allowedNamespaces.join(' or ') + ', got '
                    + enabledNamespace)
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', enabledNamespace
            // Decision tracing for the QA behaviour suite. The game runs in a
            // forked JVM, so a -D on the Gradle command line never reaches it;
            // it has to be declared on the run itself. Off unless the QA
            // controller asks for it, and the trace path is passed explicitly
            // so the controller never has to guess the run directory.
            systemProperty 'hearthstead.qa.trace',
                System.getenv('HSQA_TRACE') ? 'true' : 'false'
            if (System.getenv('HSQA_TRACE_FILE')) {
                systemProperty 'hearthstead.qa.traceFile', System.getenv('HSQA_TRACE_FILE')
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
        // QA playtest: jump the client straight into a prepared save instead
        // of driving the world-creation menus with synthetic clicks.
        client {
            if (System.getenv('HSQA_JOIN')) {
                programArgument '--quickPlayMultiplayer'
                programArgument System.getenv('HSQA_JOIN')
            }
            // The QA harness defaults to 1280x720 and may explicitly request
            // its validated 1920x1080 profile for a real effective GUI scale
            // 4 capture. options.txt's
            // overrideWidth/overrideHeight do NOT control the initial GLFW
            // window size on this launch path — the window still opened at
            // vanilla's hardcoded 854x480 default even with those options
            // set, which is what --width/--height (read directly by
            // Main.java) actually control.
            programArgument '--width'
            programArgument(System.getenv('HSQA_DISPLAY_WIDTH') ?: '1280')
            programArgument '--height'
            programArgument(System.getenv('HSQA_DISPLAY_HEIGHT') ?: '720')
        }
    }

    mods {
        hearthstead {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.hearthstead
    }
}

dependencies {
    testImplementation(enforcedPlatform('org.junit:junit-bom:5.10.3'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Specification-Title'   : 'hearthstead',
            'Specification-Vendor'  : 'Hearthstead',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Hearthstead',
            'Implementation-Version': hearthsteadBuildIdentity,
            'Implementation-Vendor' : 'Hearthstead',
            'Hearthstead-Git-Commit': hearthsteadGitCommit,
            'Hearthstead-Git-Dirty' : hearthsteadGitDirty.toString(),
            'Hearthstead-Build-Identity': hearthsteadBuildIdentity
        )
    }
}
